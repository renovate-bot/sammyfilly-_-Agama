[package]
name = "agama-locale-data"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
serde = { version = "1.0.152", features = ["derive"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
flate2 = "1.0.27"
chrono-tz = "0.8.3"
regex = "1"
